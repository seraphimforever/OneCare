<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OneCare — Locations</title>


    <!-- LEAFLET MAP CSS -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5fbfa;

            color: #163331;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            height: 76px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: white;

            border-bottom:
                1px solid #dceae8;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 11px;

            font-weight: 800;

            letter-spacing: .05em;

        }


        .logo-icon {

            width: 42px;

            height: 42px;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #10b981,
                    #0d9488
                );

            box-shadow:
                0 8px 20px
                rgba(13,148,136,.2);

        }


        .header-status {

            color: #647b78;

            font-size: 14px;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            max-width: 1400px;

            margin: auto;

            padding:
                60px 5%;

        }


        .eyebrow {

            color: #0d9488;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: .18em;

            margin-bottom: 16px;

        }


        h1 {

            font-size:
                clamp(
                    40px,
                    5vw,
                    68px
                );

            line-height: .95;

            letter-spacing: -.05em;

            margin-bottom: 18px;

        }


        h1 span {

            color: #0d9488;

            font-family:
                Georgia,
                serif;

        }


        .intro {

            color: #647b78;

            max-width: 650px;

            line-height: 1.6;

            margin-bottom: 30px;

        }


        /* =========================
           SEARCH
        ========================= */

        .controls {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 15px;

        }


        .search-box {

            flex: 1;

            min-width: 260px;

        }


        .search-box input {

            width: 100%;

            padding:
                16px 20px;

            border:
                1px solid #dceae8;

            border-radius: 16px;

            background: white;

            outline: none;

            font-size: 14px;

        }


        .search-box input:focus {

            border-color: #0d9488;

            box-shadow:
                0 0 0 4px
                rgba(13,148,136,.08);

        }


        .location-button {

            border: none;

            border-radius: 16px;

            padding:
                0 22px;

            min-height: 52px;

            background: #0d9488;

            color: white;

            font-weight: 700;

            cursor: pointer;

            transition: .25s;

        }


        .location-button:hover {

            background: #0f766e;

            transform:
                translateY(-2px);

        }


        /* =========================
           FILTERS
        ========================= */

        .filters {

            display: flex;

            gap: 9px;

            flex-wrap: wrap;

            margin-bottom: 20px;

        }


        .filter {

            border:
                1px solid #dceae8;

            background: white;

            color: #163331;

            border-radius: 100px;

            padding:
                10px 17px;

            cursor: pointer;

            font-size: 13px;

            transition: .2s;

        }


        .filter:hover {

            transform:
                translateY(-2px);

        }


        .filter.active {

            background: #0d9488;

            color: white;

            border-color: #0d9488;

        }


        /* =========================
           MAP
        ========================= */

        .map-container {

            width: 100%;

            height: 620px;

            border-radius: 30px;

            overflow: hidden;

            position: relative;

            border:
                1px solid #dceae8;

            box-shadow:
                0 25px 70px
                rgba(15,118,110,.12);

        }


        #onecareMap {

            width: 100%;

            height: 100%;

        }


        /* =========================
           MAP STATUS
        ========================= */

        .map-status {

            position: absolute;

            z-index: 1000;

            top: 18px;

            left: 18px;

            display: flex;

            align-items: center;

            gap: 12px;

            padding:
                12px 16px;

            border-radius: 16px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .95
                );

            box-shadow:
                0 12px 35px
                rgba(0,0,0,.12);

            animation:
                floating 4s
                ease-in-out
                infinite;

        }


        .status-icon {

            width: 40px;

            height: 40px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #dff7f3;

            font-size: 20px;

        }


        .status-title {

            font-weight: 700;

            font-size: 13px;

        }


        .status-text {

            display: block;

            margin-top: 3px;

            color: #647b78;

            font-size: 11px;

        }


        @keyframes floating {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-5px);

            }

        }


        /* =========================
           POPUP
        ========================= */

        .popup-title {

            font-size: 16px;

            font-weight: 800;

            margin-bottom: 5px;

        }


        .popup-type {

            color: #0d9488;

            font-size: 11px;

            font-weight: 800;

            text-transform: uppercase;

            margin-bottom: 8px;

        }


        .popup-address {

            color: #64748b;

            font-size: 12px;

            margin-bottom: 12px;

        }


        .directions-button {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding:
                9px 14px;

            border-radius: 100px;

            background: #0d9488;

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: 700;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {

                padding:
                    0 5%;

            }


            .header-status {

                display: none;

            }


            main {

                padding:
                    45px 5%;

            }


            .location-button {

                width: 100%;

            }


            .map-container {

                height: 520px;

                border-radius: 22px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">

            <div class="logo-icon">

                <i class="fa-solid fa-heart-pulse"></i>

            </div>

            ONECARE

        </div>


        <div
            class="header-status"
            id="headerLocationStatus"
        >

            Location not enabled

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <div class="eyebrow">

            ONECARE • LOCATION FINDER

        </div>


        <h1>

            Find care

            <span>
                near you.
            </span>

        </h1>


        <p class="intro">

            Find hospitals, clinics, pharmacies
            and laboratories around your location.
            Search for a healthcare provider or
            use your current location.

        </p>



        <!-- SEARCH -->

        <div class="controls">


            <div class="search-box">

                <input
                    type="text"
                    id="onecareMapSearch"
                    placeholder="Search hospitals, clinics, pharmacies or labs..."
                >

            </div>


            <button
                class="location-button"
                onclick="enableOneCareLocation()"
            >

                📍 Use My Location

            </button>


        </div>



        <!-- FILTERS -->

        <div class="filters">


            <button
                class="filter active"
                onclick="
                    filterOneCareLocations(
                        'all',
                        this
                    )
                "
            >

                🌎 All

            </button>


            <button
                class="filter"
                onclick="
                    filterOneCareLocations(
                        'hospital',
                        this
                    )
                "
            >

                🏥 Hospitals

            </button>


            <button
                class="filter"
                onclick="
                    filterOneCareLocations(
                        'clinic',
                        this
                    )
                "
            >

                🩺 Clinics

            </button>


            <button
                class="filter"
                onclick="
                    filterOneCareLocations(
                        'pharmacy',
                        this
                    )
                "
            >

                💊 Pharmacies

            </button>


            <button
                class="filter"
                onclick="
                    filterOneCareLocations(
                        'lab',
                        this
                    )
                "
            >

                🧪 Labs

            </button>


        </div>



        <!-- =========================
             MAP
        ========================= -->

        <div class="map-container">


            <div class="map-status">


                <div class="status-icon">

                    📍

                </div>


                <div>

                    <div class="status-title">

                        OneCare Map

                    </div>


                    <span
                        class="status-text"
                        id="onecareLocationStatus"
                    >

                        Select a location
                        to view details

                    </span>

                </div>


            </div>


            <div id="onecareMap"></div>


        </div>


    </main>



    <!-- =========================
         LEAFLET JAVASCRIPT
    ========================= -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>



    <script>

        /* =====================================
           VARIABLES
        ===================================== */

        let onecareMap;

        let onecareUserMarker = null;

        let onecareMarkers = [];



        /* =====================================
           DEMO HEALTHCARE LOCATIONS
        ===================================== */

        const onecareLocations = [


            {
                name:
                    "OneCare General Hospital",

                type:
                    "hospital",

                icon:
                    "🏥",

                lat:
                    6.9278,

                lng:
                    79.8615,

                address:
                    "Colombo, Sri Lanka"

            },


            {
                name:
                    "Central Care Hospital",

                type:
                    "hospital",

                icon:
                    "🏥",

                lat:
                    6.9102,

                lng:
                    79.8667,

                address:
                    "Colombo 04, Sri Lanka"

            },


            {
                name:
                    "City Medical Centre",

                type:
                    "clinic",

                icon:
                    "🩺",

                lat:
                    6.9147,

                lng:
                    79.8737,

                address:
                    "Colombo 03, Sri Lanka"

            },


            {
                name:
                    "GreenLife Clinic",

                type:
                    "clinic",

                icon:
                    "🩺",

                lat:
                    6.9400,

                lng:
                    79.8650,

                address:
                    "Colombo 07, Sri Lanka"

            },


            {
                name:
                    "HealthPlus Pharmacy",

                type:
                    "pharmacy",

                icon:
                    "💊",

                lat:
                    6.9344,

                lng:
                    79.8500,

                address:
                    "Colombo 01, Sri Lanka"

            },


            {
                name:
                    "Wellness Pharmacy",

                type:
                    "pharmacy",

                icon:
                    "💊",

                lat:
                    6.9200,

                lng:
                    79.8500,

                address:
                    "Colombo 02, Sri Lanka"

            },


            {
                name:
                    "OneCare Diagnostics Lab",

                type:
                    "lab",

                icon:
                    "🧪",

                lat:
                    6.9320,

                lng:
                    79.8580,

                address:
                    "Colombo 03, Sri Lanka"

            },


            {
                name:
                    "HealthCheck Laboratory",

                type:
                    "lab",

                icon:
                    "🧪",

                lat:
                    6.9180,

                lng:
                    79.8700,

                address:
                    "Colombo 05, Sri Lanka"

            }


        ];



        /* =====================================
           INITIALIZE MAP
        ===================================== */

        function initializeOneCareMap() {


            const mapElement =
                document.getElementById(
                    "onecareMap"
                );


            if (!mapElement) {

                return;

            }


            onecareMap =
                L.map(
                    "onecareMap"
                ).setView(

                    [
                        6.9271,
                        79.8612
                    ],

                    13

                );


            L.tileLayer(

                "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

                {

                    maxZoom:
                        19,

                    attribution:
                        "&copy; OpenStreetMap contributors"

                }

            ).addTo(
                onecareMap
            );


            displayOneCareLocations(
                onecareLocations
            );

        }



        /* =====================================
           DISPLAY LOCATIONS
        ===================================== */

        function displayOneCareLocations(
            locations
        ) {


            if (!onecareMap) {

                return;

            }


            /* Remove old markers */

            onecareMarkers.forEach(

                marker => {

                    onecareMap.removeLayer(
                        marker
                    );

                }

            );


            onecareMarkers = [];



            /* Add markers */

            locations.forEach(

                location => {


                    const marker =
                        L.marker(

                            [
                                location.lat,
                                location.lng
                            ]

                        );


                    const directionsURL =

                        "https://www.google.com/maps/dir/?api=1&destination="
                        +
                        location.lat
                        +
                        ","
                        +
                        location.lng;



                    marker.bindPopup(`

                        <div>

                            <div class="popup-title">

                                ${location.icon}

                                ${location.name}

                            </div>


                            <div class="popup-type">

                                ${location.type}

                            </div>


                            <div class="popup-address">

                                📍
                                ${location.address}

                            </div>


                            <a
                                class="directions-button"
                                href="${directionsURL}"
                                target="_blank"
                            >

                                🧭 Get Directions

                            </a>

                        </div>

                    `);


                    marker.addTo(
                        onecareMap
                    );


                    onecareMarkers.push(
                        marker
                    );

                }

            );

        }



        /* =====================================
           FILTER
        ===================================== */

        function filterOneCareLocations(
            type,
            button
        ) {


            document
                .querySelectorAll(
                    ".filter"
                )
                .forEach(

                    btn => {

                        btn.classList.remove(
                            "active"
                        );

                    }

                );


            button.classList.add(
                "active"
            );



            let filteredLocations;



            if (type === "all") {


                filteredLocations =
                    onecareLocations;


            } else {


                filteredLocations =

                    onecareLocations.filter(

                        location =>

                            location.type ===
                            type

                    );

            }



            displayOneCareLocations(
                filteredLocations
            );



            const status =
                document.getElementById(
                    "onecareLocationStatus"
                );



            if (status) {


                if (type === "all") {


                    status.textContent =
                        "Showing all healthcare locations";


                } else {


                    status.textContent =
                        "Showing "
                        +
                        type
                        +
                        "s";

                }

            }

        }



        /* =====================================
           SEARCH
        ===================================== */

        const searchBox =
            document.getElementById(
                "onecareMapSearch"
            );


        if (searchBox) {


            searchBox.addEventListener(

                "input",

                function() {


                    const query =
                        this.value
                            .toLowerCase()
                            .trim();



                    let results =
                        onecareLocations;



                    if (query) {


                        results =
                            onecareLocations.filter(

                                location =>

                                    location.name
                                        .toLowerCase()
                                        .includes(
                                            query
                                        )

                                    ||

                                    location.type
                                        .toLowerCase()
                                        .includes(
                                            query
                                        )

                                    ||

                                    location.address
                                        .toLowerCase()
                                        .includes(
                                            query
                                        )

                            );

                    }



                    displayOneCareLocations(
                        results
                    );

                }

            );

        }



        /* =====================================
           USER LOCATION
        ===================================== */

        function enableOneCareLocation() {


            if (
                !navigator.geolocation
            ) {


                alert(
                    "Your browser does not support location services."
                );


                return;

            }



            const status =
                document.getElementById(
                    "onecareLocationStatus"
                );


            const headerStatus =
                document.getElementById(
                    "headerLocationStatus"
                );



            status.textContent =
                "Finding your location...";



            navigator.geolocation.getCurrentPosition(


                function(position) {


                    const latitude =
                        position.coords.latitude;


                    const longitude =
                        position.coords.longitude;



                    /* Move map */

                    onecareMap.setView(

                        [
                            latitude,
                            longitude
                        ],

                        15

                    );



                    /* Remove previous marker */

                    if (
                        onecareUserMarker
                    ) {


                        onecareMap.removeLayer(
                            onecareUserMarker
                        );

                    }



                    /* User marker */

                    onecareUserMarker =

                        L.circleMarker(

                            [
                                latitude,
                                longitude
                            ],

                            {

                                radius:
                                    10,

                                fillColor:
                                    "#0d9488",

                                color:
                                    "#ffffff",

                                weight:
                                    4,

                                fillOpacity:
                                    1

                            }

                        ).addTo(
                            onecareMap
                        );



                    onecareUserMarker
                        .bindPopup(
                            "<b>📍 You are here</b>"
                        )
                        .openPopup();



                    status.textContent =
                        "Your location is active ✓";


                    headerStatus.textContent =
                        "Location enabled ✓";

                },


                function() {


                    status.textContent =
                        "Location permission denied";


                    headerStatus.textContent =
                        "Location unavailable";


                    alert(

                        "Please allow location access in your browser."

                    );

                },


                {

                    enableHighAccuracy:
                        true,

                    timeout:
                        10000,

                    maximumAge:
                        0

                }

            );

        }



        /* =====================================
           START
        ===================================== */

        document.addEventListener(

            "DOMContentLoaded",

            function() {

                initializeOneCareMap();

            }

        );

    </script>


</body>

</html>
