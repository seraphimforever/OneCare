<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sign In | OneCare</title>

<style>

/* =========================================================
   ONECARE LOGIN
========================================================= */

:root {

    --dark: #1E293B;

    --green: #10B981;

    --teal: #0D9488;

    --dark-teal: #0F766E;

    --mint: #F0FDFA;

    --soft-mint: #E6F4F1;

    --border: #CBD5E1;

    --white: #ffffff;

    --muted: #64748B;

    --light: #F8FAFC;

}


/* =========================================================
   RESET
========================================================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


body {

    min-height: 100vh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: var(--dark);

    background:

        radial-gradient(
            circle at 10% 15%,
            rgba(16,185,129,0.12),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(13,148,136,0.12),
            transparent 30%
        ),

        var(--light);

    overflow-x: hidden;

}


/* =========================================================
   BACKGROUND
========================================================= */

.background {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: -1;

}


.blob {

    position: absolute;

    border-radius: 50%;

    filter: blur(3px);

    opacity: .4;

    animation:
        float 10s ease-in-out infinite;

}


.blob.one {

    width: 320px;

    height: 320px;

    background:
        rgba(16,185,129,.12);

    top: -120px;

    left: -100px;

}


.blob.two {

    width: 280px;

    height: 280px;

    background:
        rgba(13,148,136,.11);

    right: -90px;

    top: 35%;

    animation-delay:
        2s;

}


.blob.three {

    width: 220px;

    height: 220px;

    background:
        rgba(16,185,129,.08);

    bottom: -90px;

    left: 40%;

    animation-delay:
        4s;

}


@keyframes float {

    0%,100% {

        transform:
            translate(0,0)
            scale(1);

    }

    50% {

        transform:
            translate(25px,-20px)
            scale(1.08);

    }

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {

    height: 76px;

    padding:
        0 45px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    background:
        rgba(255,255,255,.9);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(203,213,225,.7);

}


.logo {

    display:
        flex;

    align-items:
        center;

    gap: 11px;

    color:
        var(--dark);

    text-decoration:
        none;

    font-size:
        1.35rem;

    font-weight:
        900;

}


.logo-mark {

    width: 42px;

    height: 42px;

    border-radius: 13px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    color:
        white;

    background:
        linear-gradient(
            135deg,
            var(--green),
            var(--teal)
        );

    box-shadow:
        0 8px 22px
        rgba(13,148,136,.2);

}


.logo span {

    color:
        var(--teal);

}


.back {

    color:
        var(--muted);

    text-decoration:
        none;

    font-size:
        .72rem;

    font-weight:
        700;

}


.back:hover {

    color:
        var(--teal);

}


/* =========================================================
   MAIN
========================================================= */

main {

    min-height:
        calc(100vh - 76px);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        40px 20px;

}


/* =========================================================
   LOGIN CARD
========================================================= */

.card {

    width:
        min(460px,100%);

    background:
        white;

    border:
        1px solid
        rgba(203,213,225,.8);

    border-radius:
        28px;

    padding:
        48px;

    box-shadow:
        0 25px 70px
        rgba(15,23,42,.08);

    animation:
        appear .6s ease;

    text-align: center;

}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(.98);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   HEADING
========================================================= */

.icon {

    width: 68px;

    height: 68px;

    border-radius: 21px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:
        var(--soft-mint);

    font-size:
        1.7rem;

    margin:
        0 auto 22px;

}


h1 {

    font-size:
        2rem;

    letter-spacing:
        -1px;

    margin-bottom:
        8px;

}


.subtitle {

    color:
        var(--muted);

    font-size:
        .82rem;

    line-height:
        1.6;

    margin-bottom:
        32px;

}


/* =========================================================
   CONTINUE BUTTON
========================================================= */

.continue {

    width:
        100%;

    height:
        51px;

    border:
        none;

    border-radius:
        13px;

    background:
        linear-gradient(
            135deg,
            var(--green),
            var(--teal)
        );

    color:
        white;

    font-family:
        inherit;

    font-size:
        .82rem;

    font-weight:
        900;

    cursor:
        pointer;

    box-shadow:
        0 9px 22px
        rgba(13,148,136,.2);

    transition:
        .2s;

}


.continue:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 13px 28px
        rgba(13,148,136,.25);

}


.continue:active {

    transform:
        translateY(0);

}


/* =========================================================
   DIVIDER
========================================================= */

.divider {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

    margin:
        25px 0;

    color:
        #94A3B8;

    font-size:
        .6rem;

}


.divider::before,
.divider::after {

    content: "";

    height:
        1px;

    flex: 1;

    background:
        #E2E8F0;

}


/* =========================================================
   SIGN UP
========================================================= */

.signup {

    text-align:
        center;

    font-size:
        .7rem;

    color:
        var(--muted);

}


.signup a {

    color:
        var(--teal);

    font-weight:
        800;

    text-decoration:
        none;

}


.signup a:hover {

    text-decoration:
        underline;

}


/* =========================================================
   SECURITY
========================================================= */

.security {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        6px;

    margin-top:
        25px;

    color:
        #94A3B8;

    font-size:
        .58rem;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px) {

    .navbar {

        padding:
            0 18px;

    }

    .back {

        display:
            none;

    }

    main {

        padding:
            25px 15px;

    }

    .card {

        padding:
            35px 22px;

        border-radius:
            23px;

    }

    h1 {

        font-size:
            1.7rem;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
====================================================== -->

<div class="background">

    <div class="blob one"></div>

    <div class="blob two"></div>

    <div class="blob three"></div>

</div>


<!-- =====================================================
     NAVBAR
====================================================== -->

<nav class="navbar">

    <a href="index.html" class="logo">

        <div class="logo-mark">
            ✚
        </div>

        One<span>Care</span>

    </a>


    <a
        href="index.html"
        class="back"
    >

        ← Back to OneCare

    </a>

</nav>


<!-- =====================================================
     MAIN
====================================================== -->

<main>


<div class="card">


    <div class="icon">
        🔐
    </div>


    <h1>
        Welcome back.
    </h1>


    <p class="subtitle">

        Sign in to access your health
        information, appointments and documents.

    </p>


    <!-- =================================================
         CONTINUE
    ================================================== -->

    <a
        href="patient-login.html"
        class="continue"
        style="
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        "
    >

        Continue to Sign In

    </a>


    <div class="divider">
        or
    </div>


    <div class="signup">

        Don't have a OneCare account?

        <a href="signup.html">
            Create one
        </a>

    </div>


    <div class="security">

        🔒 Secure access • Privacy first

    </div>


</div>


</main>


</body>

</html>
